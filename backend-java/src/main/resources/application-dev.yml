# 仅本机开发使用。数据库连接不加密，因为容器只监听 127.0.0.1。
# 任何对外可访问的环境都必须用 SPRING_PROFILES_ACTIVE=prod。
spring:
  config:
    # 直接从仓库根的 .env 读取，IDE 里点运行、命令行 mvn 都能起来，不必先手工导出变量。
    # optional：文件不存在时不报错，交给 StartupSecurityValidator 报「MYSQL_PASSWORD 未设置」这类可读提示。
    # 只放在 dev：prod 必须由真实环境变量注入，避免误把磁盘上的旧 .env 带进生产。
    # 优先级上 OS 环境变量高于配置文件，所以临时覆盖仍然有效（例如 APP_MASTER_KEY=xxx mvn ...）。
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:33307}/${MYSQL_DATABASE:knowbase}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:knowbase}
    password: ${MYSQL_PASSWORD}

logging:
  level:
    com.knowbase: DEBUG

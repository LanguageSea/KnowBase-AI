# 本地开发：直连本机 MySQL 5.7，库 knowbaseai，账号 root，密码 root，端口 3306。
# 写死在这里，不再依赖 MYSQL_* 环境变量，避免被仓库根 .env（33307/knowbase）带偏。
# .env 仍然会加载，供 APP_MASTER_KEY / INTERNAL_TOKEN / Redis / Qdrant 等使用。
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/dev
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/knowbaseai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
logging:
  level:
    com.knowbase: DEBUG

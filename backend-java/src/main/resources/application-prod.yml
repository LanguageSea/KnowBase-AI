# 单机/生产：默认同样连本地 knowbaseai / root / root，方便毕设演示。
# 如需连别的库，用环境变量覆盖即可：MYSQL_HOST / MYSQL_PORT / MYSQL_DATABASE / MYSQL_USER / MYSQL_PASSWORD。
# 注意 prod 不加载磁盘 .env，必须由真实环境变量注入。
spring:
  datasource:
    # 默认要求校验数据库证书；单机 Docker 内网编排显式传 MYSQL_SSL_MODE=DISABLED。
    # 跨主机或托管数据库部署不得关闭 TLS。
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=${MYSQL_SSL_MODE:VERIFY_IDENTITY}&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      password: ${REDIS_PASSWORD:}
server:
  forward-headers-strategy: native
logging:
  level:
    com.knowbase: INFO

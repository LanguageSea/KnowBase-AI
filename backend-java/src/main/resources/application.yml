server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: knowbase-backend

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:33307}/${MYSQL_DATABASE:knowbase}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:knowbase}
    password: ${MYSQL_PASSWORD:change-me-app}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false

knowbase:
  qdrant:
    url: ${QDRANT_URL:http://127.0.0.1:6333}
    timeout-ms: 2000

logging:
  level:
    root: INFO
    com.knowbase: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{40} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
spring:
  application:
    name: knowbase-backend
  profiles:
    default: dev
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      validation-timeout: 2000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:16380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      enabled: true
app:
  jwt:
    ttl-seconds: 7200
knowbase:
  qdrant:
    url: ${QDRANT_URL:http://127.0.0.1:6333}
    api-key: ${QDRANT_API_KEY:}
    timeout-ms: ${QDRANT_TIMEOUT_MS:2000}
  python:
    base-url: ${PYTHON_SERVICE_URL:http://127.0.0.1:8090}
    connect-timeout-ms: ${PYTHON_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${PYTHON_READ_TIMEOUT_MS:65000}
  storage:
    upload-dir: ${UPLOAD_DIR:./data/uploads}
  qa:
    top-k: ${QA_TOP_K:5}
    score-threshold: ${QA_SCORE_THRESHOLD:0.2}
    rate-limit-per-minute: ${QA_RATE_LIMIT_PER_MINUTE:20}
    context-token-budget: ${QA_CONTEXT_TOKEN_BUDGET:3000}
    max-context-chunks: ${QA_MAX_CONTEXT_CHUNKS:8}
    stream-timeout-ms: ${QA_STREAM_TIMEOUT_MS:90000}
  security:
    master-key: ${APP_MASTER_KEY:}
    internal-token: ${INTERNAL_TOKEN:}
    allow-private-model-urls: ${ALLOW_PRIVATE_MODEL_URLS:false}
logging:
  level:
    root: INFO
    com.knowbase: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{40} - %msg%n"
